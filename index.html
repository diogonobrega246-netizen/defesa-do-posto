<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101820"><title>Defesa do Posto</title>
<style>
:root{--bg:#101820;--panel:#1b2933;--panel2:#263944;--gold:#f6c453;--green:#8bd17c;--text:#f1f5f4;--muted:#a8b8bb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}button,input,select{font:inherit}button{border:1px solid #50616a;background:linear-gradient(180deg,#314650,#24343d);color:var(--text);padding:12px 16px;border-radius:12px;font-weight:800;letter-spacing:.04em;box-shadow:0 3px 0 #101820;cursor:pointer}button:active{transform:translateY(2px);box-shadow:none}button.primary{background:linear-gradient(180deg,#e7b84d,#b77b22);color:#182128;border-color:#ffdc82}button:disabled{opacity:.4;cursor:not-allowed}#game{position:fixed;inset:0;width:100%;height:100%;display:block;background:#18251e}#hud{position:fixed;inset:0;pointer-events:none;display:none}.topbar{position:absolute;left:12px;right:12px;top:env(safe-area-inset-top,8px);display:flex;justify-content:space-between;gap:8px;align-items:flex-start;text-shadow:0 2px 3px #000}.hudbox{background:#101820c9;border:1px solid #64746d88;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:800}.bar{height:7px;background:#26343a;border-radius:9px;overflow:hidden;margin-top:4px;width:120px}.bar i{display:block;height:100%;background:#85d66d;width:100%}#joystick{position:absolute;left:22px;bottom:24px;width:126px;height:126px;border-radius:50%;background:#d9e7e722;border:2px solid #d9e7e766;pointer-events:auto;touch-action:none}#stick{position:absolute;width:52px;height:52px;left:35px;top:35px;border-radius:50%;background:#d9e7e7aa;border:2px solid #fff9}#fireBtn{position:absolute;right:22px;bottom:30px;width:94px;height:94px;border-radius:50%;background:#a43d35dd;border:3px solid #ffb0a0;pointer-events:auto;touch-action:none;display:none}#reload{position:absolute;right:28px;bottom:140px;pointer-events:auto;padding:8px 12px;display:none}#menu,#panel{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(135deg,#0c151cdd,#16251fdd);overflow:auto}#panel{display:none;background:#0b1318eF;z-index:5}.window{width:min(560px,100%);max-height:94%;overflow:auto;background:linear-gradient(160deg,#263943,#17252d);border:1px solid #627780;border-radius:20px;padding:20px;box-shadow:0 18px 55px #0009}.logo{font-size:clamp(27px,7vw,42px);font-weight:1000;line-height:1;color:#f4c85e;text-align:center;text-shadow:0 3px #68451d;margin:8px 0}.sub{text-align:center;color:var(--muted);font-size:13px;margin:8px 0 18px}.menuButtons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.menuButtons button:first-child{grid-column:1/-1;padding:17px}.balance{text-align:center;color:var(--gold);font-weight:900;margin:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff18}.row small,.muted{color:var(--muted)}h2{margin:0 0 10px;color:#f5cc68}h3{margin:14px 0 6px}.close{float:right;padding:7px 11px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.upgrade{min-height:145px;text-align:left;white-space:normal;padding:10px}.upgrade b{display:block;color:var(--gold);margin-bottom:8px}.skinGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.skin{padding:10px;border:1px solid #ffffff22;border-radius:12px;background:#101b22}.swatch{height:24px;border-radius:7px;margin-bottom:7px;border:1px solid #fff5}.skin button{width:100%;padding:8px;margin-top:6px;font-size:12px}.rarity{font-size:11px;color:var(--gold)}input[type=range]{width:100%;accent-color:#f2c35b}select{background:#18252d;color:white;border:1px solid #657780;border-radius:8px;padding:8px}.prob{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:#c4d0d0}#rouletteResult{text-align:center;font-size:22px;color:var(--gold);min-height:34px;margin:12px}#toast{position:fixed;top:12%;left:50%;transform:translateX(-50%);background:#111e;color:white;padding:10px 16px;border-radius:12px;display:none;z-index:10;border:1px solid #71827c}.orient{display:none}@media(orientation:landscape){.window{max-width:700px}.menuButtons{grid-template-columns:repeat(4,1fr)}.menuButtons button:first-child{grid-column:auto}.skinGrid{grid-template-columns:repeat(3,1fr)}}@media(orientation:portrait){#joystick{width:112px;height:112px}#stick{left:29px;top:29px}}
</style></head><body>
<canvas id="game"></canvas>
<div id="hud"><div class="topbar"><div class="hudbox">ONDA <span id="wave">1</span> · NÍVEL <span id="level">1</span><div class="bar"><i id="hpbar"></i></div><small id="hptext">100 / 100</small></div><div class="hudbox" style="text-align:right">🪙 <span id="runCoins">0</span><br><span id="ammo">30 / 30</span></div></div><div id="joystick"><div id="stick"></div></div><button id="fireBtn">ATIRAR</button><button id="reload">RECARREGAR</button></div>
<div id="menu"><div class="window"><div class="logo">DEFESA DO POSTO</div><div class="sub">SOBREVIVA ÀS ONDAS · EVOLUA · PROTEJA O POSTO</div><div class="balance">🪙 <span id="menuCoins">0</span> moedas</div><div class="menuButtons"><button class="primary" id="start">COMEÇAR JOGO</button><button id="shop">LOJA DE SKINS</button><button id="wheel">ROLETA RNG</button><button id="settings">CONFIGURAÇÕES</button></div><p class="sub">Recorde de onda: <b id="bestWave">0</b></p></div></div>
<div id="panel"><div class="window"><button class="close" id="closePanel">VOLTAR</button><div id="panelContent"></div></div></div><div id="toast"></div>
<script>
'use strict';
// Probabilidades editáveis (a soma deve ser 100).
const RARITY_CHANCES={Comum:48,Incomum:27,Raro:15,Épico:8,Lendário:2};
const RARITY_PRICE={Comum:100,Incomum:180,Raro:300,Épico:550,Lendário:1000};
const SKINS=[
 ['Camuflado','#66734b','Comum'],['Amarelo','#e8bd32','Comum'],['Ciano','#38c6d1','Incomum'],['Verde','#36a45c','Comum'],['Roxo','#8c58c8','Incomum'],['Azul','#397ed1','Comum'],['Vermelho','#d64b43','Incomum'],['Laranja','#e98232','Comum'],['Preto','#303940','Raro'],['Rosa','#e77cb5','Raro'],['Ouro','#e4b83e','Épico'],['Arco-íris','rainbow','Lendário'],['Areia','#bda77a','Comum'],['Gelo','#a8e2e8','Raro']
];
const $=id=>document.getElementById(id);const canvas=$('game'),ctx=canvas.getContext('2d');
const defaults={coins:500,owned:[0],equipped:0,bestWave:0,music:25,sfx:70,quality:'média',mode:'automático'};
let save;try{save={...defaults,...JSON.parse(localStorage.getItem('defesaSave')||'{}')}}catch(e){save={...defaults}}
function persist(){localStorage.setItem('defesaSave',JSON.stringify(save));$('menuCoins').textContent=save.coins;$('bestWave').textContent=save.bestWave}
persist();
let W=innerWidth,H=innerHeight,dpr=1,playing=false,paused=false,last=0,shake=0,entities=[],bullets=[],particles=[],drops=[],wave=1,spawnTimer=0,kills=0,runCoins=0,player,ammo=30,reloadTimer=0,fireCooldown=0,flash=0,xp=0,level=1,joystick={x:0,y:0},joyPointer=null,fireHeld=false,audio=null,musicTimer=null,rouletteBusy=false;
const weapons={pistola:{name:'Pistola',damage:24,rate:.34,spread:.04,pellets:1,penetration:0,mag:30,reload:1.3},escopeta:{name:'Escopeta',damage:13,rate:.75,spread:.34,pellets:6,penetration:0,mag:8,reload:1.7},fuzil:{name:'Fuzil',damage:20,rate:.15,spread:.07,pellets:1,penetration:1,mag:36,reload:1.5},submetralhadora:{name:'Submetralhadora',damage:13,rate:.085,spread:.14,pellets:1,penetration:0,mag:45,reload:1.4},sniper:{name:'Sniper',damage:95,rate:1.0,spread:.01,pellets:1,penetration:3,mag:5,reload:2},granada:{name:'Lança-granadas',damage:70,rate:.9,spread:.03,pellets:1,penetration:0,mag:6,reload:2}};
let weapon='pistola',stats={damage:1,rate:1,speed:1,maxHp:100,hp:100,mag:30,reload:1,penetration:0,extra:0,crit:0,regen:0};
function resize(){W=innerWidth;H=innerHeight;dpr=save.quality==='baixa'?Math.min(devicePixelRatio||1,1):save.quality==='média'?Math.min(devicePixelRatio||1,1.5):Math.min(devicePixelRatio||1,2);canvas.width=Math.floor(W*dpr);canvas.height=Math.floor(H*dpr);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function audioInit(){if(!audio){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audio=new AC()}if(audio&&audio.state==='suspended')audio.resume()}
function tone(freq,dur,type='square',vol=.08,slide=0){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),audio.currentTime+dur);g.gain.setValueAtTime(vol*(save.sfx/100),audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur)}
function sound(kind){audioInit();const map={shot:[110,.09,'sawtooth',.12,-65],shotgun:[75,.18,'sawtooth',.17,-45],rifle:[145,.07,'square',.09,-80],smg:[180,.045,'square',.07,-90],sniper:[65,.25,'triangle',.2,-50],grenade:[55,.3,'sawtooth',.2,-35],reload:[420,.16,'triangle',.06,-180],empty:[180,.07,'square',.04,-80],hit:[260,.07,'triangle',.07,-100],death:[90,.18,'sawtooth',.06,-60],damage:[120,.2,'sawtooth',.12,-70],coin:[740,.12,'sine',.07,240],reward:[520,.28,'sine',.1,450]};let m=map[kind]||map.hit;tone(...m)}
function music(){if(!audio||save.music===0)return;const notes=[110,146.8,164.8,130.8];let i=0;clearInterval(musicTimer);musicTimer=setInterval(()=>{if(!playing||!audio)return;let f=notes[i++%notes.length];tone(f,.35,'triangle',.018*(save.music/25),0)},650)}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',1800)}
function resetGame(){entities=[];bullets=[];particles=[];drops=[];wave=1;kills=0;runCoins=0;xp=0;level=1;ammo=30;reloadTimer=0;weapon='pistola';stats={damage:1,rate:1,speed:1,maxHp:100,hp:100,mag:30,reload:1,penetration:0,extra:0,crit:0,regen:0};player={x:W/2,y:H/2,r:16,hp:100,angle:0,invuln:0};spawnTimer=.5;}
function startGame(){audioInit();try{document.documentElement.requestFullscreen?.()}catch(e){}try{screen.orientation?.lock?.('landscape').catch(()=>{})}catch(e){}resetGame();playing=true;paused=false;$('menu').style.display='none';$('panel').style.display='none';$('hud').style.display='block';$('fireBtn').style.display=save.mode==='manual'?'block':'none';$('reload').style.display='block';music();last=performance.now();requestAnimationFrame(loop)}
function endGame(){playing=false;$('hud').style.display='none';$('menu').style.display='flex';save.bestWave=Math.max(save.bestWave,wave);persist();$('menuCoins').textContent=save.coins;showEnd()}
function rand(a,b){return a+Math.random()*(b-a)}function nearest(){let best=null,dist=1e9;for(const e of entities){let d=Math.hypot(e.x-player.x,e.y-player.y);if(d<dist){dist=d;best=e}}return best}
function spawnEnemy(){let side=Math.floor(Math.random()*4),x=side===0?rand(0,W):side===1?W+20:side===2?rand(0,W):-20,y=side===0?-20:side===1?rand(0,H):side===2?H+20:rand(0,H);let lv=Math.min(4,1+Math.floor((wave-1)/3)+Math.floor(Math.random()*Math.min(2,wave/5)));lv=Math.max(1,lv);let colors=['','#d7d5bb','#e0b04b','#dc6b45','#a94f9c'];entities.push({x,y,r:13+lv,lv,hp:35+lv*32+wave*3,max:35+lv*32+wave*3,speed:35+lv*9+wave*1.5,color:colors[lv],hit:0})}
function shoot(){if(!playing||paused||reloadTimer>0)return;if(ammo<=0){sound('empty');reload();return}let target=nearest();if(!target)return;let w=weapons[weapon],dx=target.x-player.x,dy=target.y-player.y,base=Math.atan2(dy,dx);player.angle=base;let pellets=w.pellets+stats.extra;for(let i=0;i<pellets;i++){let a=base+rand(-w.spread,w.spread),speed=weapon==='granada'?360:650;bullets.push({x:player.x+Math.cos(a)*18,y:player.y+Math.sin(a)*18,vx:Math.cos(a)*speed,vy:Math.sin(a)*speed,life:weapon==='sniper'?1.4:.8,damage:w.damage*stats.damage,pen:w.penetration+stats.penetration,crit:Math.random()<stats.crit})}ammo--;fireCooldown=w.rate/stats.rate;flash=.08;sound(weapon==='escopeta'?'shotgun':weapon==='fuzil'?'rifle':weapon==='submetralhadora'?'smg':weapon==='sniper'?'sniper':weapon==='granada'?'grenade':'shot');updateHud()}
function reload(){if(reloadTimer>0||ammo>=stats.mag)return;reloadTimer=weapons[weapon].reload*stats.reload;sound('reload')}
function damagePlayer(n){if(player.invuln>0)return;stats.hp-=n;player.invuln=.55;shake=9;sound('damage');try{navigator.vibrate?.(70)}catch(e){}for(let i=0;i<7;i++)particles.push({x:player.x,y:player.y,vx:rand(-90,90),vy:rand(-90,90),life:.3,color:'#c94a45'});if(stats.hp<=0){stats.hp=0;updateHud();endGame()}else updateHud()}
function killEnemy(e){entities.splice(entities.indexOf(e),1);kills++;sound('death');let reward=[0,3,8,18,40][e.lv];drops.push({x:e.x,y:e.y,value:reward,life:10});xp+=10+e.lv*5;if(Math.random()<.18)drops.push({x:e.x+8,y:e.y-8,value:1,life:10});if(xp>=level*50){xp-=level*50;level++;paused=true;showUpgrades()}}
function updateHud(){$('wave').textContent=wave;$('level').textContent=level;$('runCoins').textContent=runCoins;$('ammo').textContent=reloadTimer>0?'RECARREGANDO':ammo+' / '+stats.mag;$('hptext').textContent=Math.ceil(stats.hp)+' / '+stats.maxHp;$('hpbar').style.width=Math.max(0,stats.hp/stats.maxHp*100)+'%'}
function spawnParticles(x,y,color,n=5){let count=save.quality==='baixa'?Math.ceil(n/2):save.quality==='média'?n:n*2;for(let i=0;i<count;i++)particles.push({x,y,vx:rand(-100,100),vy:rand(-100,100),life:rand(.15,.45),color})}
function update(dt){if(!playing||paused)return;spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnTimer=Math.max(.18,1.05-wave*.045)}if(kills>=wave*12){wave++;kills=0;let bonus=wave*20;save.coins+=bonus;runCoins+=bonus;sound('reward');toast('Bônus da onda: +'+bonus+' moedas');persist()}
if(stats.regen>0)stats.hp=Math.min(stats.maxHp,stats.hp+stats.regen*dt);player.x=Math.max(20,Math.min(W-20,player.x+joystick.x*220*stats.speed*dt));player.y=Math.max(20,Math.min(H-20,player.y+joystick.y*220*stats.speed*dt));if(player.invuln>0)player.invuln-=dt;if(flash>0)flash-=dt;if(fireCooldown>0)fireCooldown-=dt;if(save.mode==='automático'&&fireCooldown<=0)shoot();if(save.mode==='manual'&&fireHeld&&fireCooldown<=0)shoot();if(reloadTimer>0){reloadTimer-=dt;if(reloadTimer<=0){ammo=stats.mag;reloadTimer=0;updateHud()}}
for(const e of [...entities]){let a=Math.atan2(player.y-e.y,player.x-e.x),d=Math.hypot(player.x-e.x,player.y-e.y);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(d<e.r+player.r)damagePlayer(9+e.lv*3);if(e.hit>0)e.hit-=dt}
for(const b of [...bullets]){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H){bullets.splice(bullets.indexOf(b),1);continue}for(const e of [...entities])if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){let dmg=b.damage*(b.crit?2:1);e.hp-=dmg;e.hit=.08;sound('hit');spawnParticles(b.x,b.y,'#d45c52',3);if(e.hp<=0)killEnemy(e);if(b.pen>0)b.pen--;else{bullets.splice(bullets.indexOf(b),1);break}}}
for(const d of [...drops]){d.life-=dt;if(Math.hypot(player.x-d.x,player.y-d.y)<35){runCoins+=d.value;save.coins+=d.value;drops.splice(drops.indexOf(d),1);sound('coin');persist()}else if(d.life<=0)drops.splice(drops.indexOf(d),1)}for(const p of [...particles]){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(particles.indexOf(p),1)}updateHud()}
function drawSoldier(x,y,angle,color='#4e7c55',scale=1){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(scale,scale);ctx.fillStyle='#17221d';ctx.beginPath();ctx.ellipse(0,2,17,13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#4e7c55';ctx.fillRect(-9,-10,19,20);ctx.fillStyle='#d2c6a3';ctx.beginPath();ctx.arc(0,-5,9,0,Math.PI*2);ctx.fill();ctx.fillStyle='#59656a';ctx.fillRect(3,-8,9,5);ctx.fillStyle=color==='rainbow'?'#d34fb7':color; if(color==='rainbow'){let g=ctx.createLinearGradient(6,-2,24,3);g.addColorStop(0,'#ef4545');g.addColorStop(.25,'#f5cf42');g.addColorStop(.5,'#4acb75');g.addColorStop(.75,'#438de0');g.addColorStop(1,'#ad62dc');ctx.fillStyle=g}ctx.fillRect(6,-2,18,5);ctx.fillStyle='#a9b0a5';ctx.fillRect(16,-1,15,3);ctx.fillStyle='#394b3d';ctx.fillRect(-8,8,6,8);ctx.fillRect(3,8,6,8);ctx.restore()}
function draw(){ctx.save();if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.82;if(shake<.4)shake=0}ctx.fillStyle='#1a2a22';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff09';ctx.lineWidth=1;let grid=42;for(let x=0;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
for(const d of drops){ctx.fillStyle='#f6c453';ctx.beginPath();ctx.arc(d.x,d.y,6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff2b2';ctx.fillRect(d.x-2,d.y-1,4,2)}for(const e of entities){ctx.fillStyle='#151d1b';ctx.beginPath();ctx.arc(e.x,e.y,e.r+2,0,7);ctx.fill();ctx.fillStyle=e.hit>0?'#fff':e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#202b30';ctx.fillRect(e.x-7,e.y-5,14,10);ctx.fillStyle='#d9d1b6';ctx.beginPath();ctx.arc(e.x,e.y-7,7,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText('N'+e.lv,e.x,e.y-e.r-8);ctx.fillStyle='#382a27';ctx.fillRect(e.x-14,e.y-e.r-4,28,3);ctx.fillStyle='#80d66e';ctx.fillRect(e.x-14,e.y-e.r-4,28*Math.max(0,e.hp/e.max),3)}for(const b of bullets){ctx.fillStyle=weapon==='granada'?'#e6a64c':'#ffe9a1';ctx.beginPath();ctx.arc(b.x,b.y,weapon==='sniper'?3:2.5,0,7);ctx.fill()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*3);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(player){drawSoldier(player.x,player.y,player.angle,save.equipped===0?'#63734b':SKINS[save.equipped][1]);if(flash>0){ctx.fillStyle='#fff2a8';ctx.beginPath();ctx.arc(player.x+Math.cos(player.angle)*34,player.y+Math.sin(player.angle)*34,rand(5,10),0,7);ctx.fill()}if(player.invuln>0&&Math.floor(performance.now()/80)%2===0){ctx.strokeStyle='#ffb3a5';ctx.lineWidth=2;ctx.beginPath();ctx.arc(player.x,player.y,23,0,7);ctx.stroke()}}ctx.restore()}
function loop(t){if(!playing)return;let dt=Math.min(.04,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}
function showPanel(content){$('panelContent').innerHTML=content;$('panel').style.display='flex'}function showUpgrades(){let options=[['Dano reforçado','Aumenta o dano em 20%.',()=>stats.damage*=1.2],['Cadência','Atira 15% mais rápido.',()=>stats.rate*=1.15],['Passos leves','Aumenta a velocidade em 15%.',()=>stats.speed*=1.15],['Colete reforçado','+25 de vida máxima e cura.',()=>{stats.maxHp+=25;stats.hp+=25}],['Pente ampliado','+10 balas no pente.',()=>stats.mag+=10],['Recarga rápida','Recarga 20% mais rápida.',()=>stats.reload*=.8],['Perfuração','Projéteis atravessam +1 inimigo.',()=>stats.penetration++],['Tiro extra','Dispara um projétil adicional.',()=>stats.extra++],['Acerto crítico','+10% de chance de dano dobrado.',()=>stats.crit+=.1],['Regeneração','Recupera 1,5 de vida por segundo.',()=>stats.regen+=1.5],['Escopeta','Disparos em leque e alto impacto.',()=>{weapon='escopeta';ammo=8;stats.mag=8}],['Fuzil','Ritmo estável e perfuração.',()=>{weapon='fuzil';ammo=36;stats.mag=36}],['Submetralhadora','Cadência muito alta.',()=>{weapon='submetralhadora';ammo=45;stats.mag=45}],['Sniper','Disparo preciso e potente.',()=>{weapon='sniper';ammo=5;stats.mag=5}],['Lança-granadas','Projétil explosivo de alto dano.',()=>{weapon='granada';ammo=6;stats.mag=6}]];options.sort(()=>Math.random()-.5);let chosen=options.slice(0,3);showPanel('<h2>SUBIU DE NÍVEL!</h2><p class="muted">Escolha uma melhoria para continuar.</p><div class="cards">'+chosen.map((o,i)=>`<button class="upgrade" data-up="${i}"><b>${o[0]}</b>${o[1]}</button>`).join('')+'</div>');$('panel').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{chosen[+b.dataset.up][2]();paused=false;$('panel').style.display='none';updateHud()})}
function rarityColor(r){return ({Comum:'#bdc7c7',Incomum:'#75d28a',Raro:'#64a9ee',Épico:'#c38af0',Lendário:'#f3c85e'})[r]}
function showShop(){let html='<h2>LOJA DE SKINS</h2><p class="muted">Escolha a aparência do fuzil. As skins compradas ficam no seu inventário.</p><div class="skinGrid">';SKINS.forEach((s,i)=>{let own=save.owned.includes(i),eq=save.equipped===i;html+=`<div class="skin"><div class="swatch" style="background:${s[1]==='rainbow'?'linear-gradient(90deg,red,orange,yellow,green,cyan,blue,violet)':s[1]}"></div><b>${s[0]}</b><div class="rarity" style="color:${rarityColor(s[2])}">${s[2]} · ${RARITY_PRICE[s[2]]} moedas</div><button data-skin="${i}" ${eq?'disabled':''}>${eq?'EQUIPADA':own?'EQUIPAR':'COMPRAR'}</button></div>`});html+='</div>';showPanel(html);$('panel').querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{let i=+b.dataset.skin,s=SKINS[i];if(save.owned.includes(i)){save.equipped=i;toast('Skin equipada')}else if(save.coins>=RARITY_PRICE[s[2]]){save.coins-=RARITY_PRICE[s[2]];save.owned.push(i);save.equipped=i;sound('coin');toast('Skin comprada e equipada!')}else toast('Moedas insuficientes');persist();showShop()})}
function rollRarity(){let total=Object.values(RARITY_CHANCES).reduce((a,b)=>a+b,0),r=Math.random()*total;for(const [name,chance] of Object.entries(RARITY_CHANCES)){r-=chance;if(r<0)return name}return 'Comum'}
function showWheel(){let probs=Object.entries(RARITY_CHANCES).map(([k,v])=>`<div class="prob"><span style="color:${rarityColor(k)}">${k}</span><b>${(v/Object.values(RARITY_CHANCES).reduce((a,b)=>a+b,0)*100).toFixed(1)}%</b></div>`).join('');showPanel(`<h2>ROLETA RNG</h2><p class="muted">Custo: 300 moedas · Resultado definido antes da animação.</p><div id="rouletteResult">PRONTO PARA GIRAR?</div><div>${probs}</div><button class="primary" id="spin" style="width:100%;margin-top:14px" ${rouletteBusy?'disabled':''}>GIRAR · 300 🪙</button><p class="muted">Se sair uma skin repetida, você recebe metade do preço dela de volta.</p>`);$('spin').onclick=spinWheel}
function spinWheel(){if(rouletteBusy)return;if(save.coins<300){toast('Você precisa de 300 moedas');return}save.coins-=300;persist();rouletteBusy=true;let rarity=rollRarity(),pool=SKINS.map((s,i)=>({s,i})).filter(o=>o.s[2]===rarity);if(!pool.length)pool=SKINS.map((s,i)=>({s,i}));let result=pool[Math.floor(Math.random()*pool.length)],el=$('rouletteResult');$('spin').disabled=true;let start=performance.now(),duration=2400;function animate(t){let p=Math.min(1,(t-start)/duration);el.textContent=p<.88?SKINS[Math.floor(Math.random()*SKINS.length)][0]+'  ✦  GIRANDO...':result.s[0];el.style.transform=`rotate(${Math.sin(t/45)*(1-p)*12}deg)`;if(p<1)requestAnimationFrame(animate);else{let msg;if(save.owned.includes(result.i)){let refund=Math.floor(RARITY_PRICE[result.s[2]]/2);save.coins+=refund;msg=`Repetida! Reembolso de ${refund} moedas.`}else{save.owned.push(result.i);msg='Nova skin adicionada ao inventário!'}rouletteBusy=false;persist();sound('reward');el.textContent=result.s[0]+' — '+result.s[2];let p=document.createElement('p');p.textContent=msg;p.className='muted';el.after(p);$('spin').disabled=false;$('spin').textContent='GIRAR NOVAMENTE · 300 🪙'}}requestAnimationFrame(animate)}
function showSettings(){showPanel(`<h2>CONFIGURAÇÕES</h2><div class="row"><label>Música <b id="mv">${save.music}%</b><input id="musicVol" type="range" min="0" max="100" value="${save.music}"></label></div><div class="row"><label>Efeitos sonoros <b id="sv">${save.sfx}%</b><input id="sfxVol" type="range" min="0" max="100" value="${save.sfx}"></label></div><div class="row"><label>Qualidade gráfica</label><select id="quality"><option ${save.quality==='baixa'?'selected':''}>baixa</option><option ${save.quality==='média'?'selected':''}>média</option><option ${save.quality==='alta'?'selected':''}>alta</option></select></div><div class="row"><label>Disparo</label><select id="mode"><option value="automático" ${save.mode==='automático'?'selected':''}>Automático</option><option value="manual" ${save.mode==='manual'?'selected':''}>Manual</option></select></div><p class="muted">A orientação horizontal é solicitada ao iniciar. Se o navegador não permitir, o jogo continua funcionando em pé.</p><button class="primary" id="saveSettings" style="width:100%">SALVAR CONFIGURAÇÕES</button>`);$('musicVol').oninput=e=>$('mv').textContent=e.target.value+'%';$('sfxVol').oninput=e=>$('sv').textContent=e.target.value+'%';$('saveSettings').onclick=()=>{save.music=+$('musicVol').value;save.sfx=+$('sfxVol').value;save.quality=$('quality').value;save.mode=$('mode').value;persist();resize();if(playing)$('fireBtn').style.display=save.mode==='manual'?'block':'none';toast('Configurações salvas');$('panel').style.display='none'}}
function showEnd(){showPanel(`<h2>FIM DE JOGO</h2><p>Você chegou à onda <b>${wave}</b>.</p><p>Moedas coletadas nesta partida: <b>${runCoins}</b></p><button class="primary" id="again">JOGAR NOVAMENTE</button>`);$('again').onclick=startGame}
$('start').onclick=startGame;$('shop').onclick=showShop;$('wheel').onclick=showWheel;$('settings').onclick=showSettings;$('closePanel').onclick=()=>{$('panel').style.display='none';if(playing&&paused)paused=false};
const joy=$('joystick'),stick=$('stick');function joyMove(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),max=43;if(len>max){dx=dx/len*max;dy=dy/len*max}joystick.x=dx/max;joystick.y=dy/max;stick.style.transform=`translate(${dx}px,${dy}px)`}joy.addEventListener('pointerdown',e=>{joyPointer=e.pointerId;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',e=>{if(e.pointerId===joyPointer)joyMove(e)});function joyEnd(e){if(e.pointerId===joyPointer){joyPointer=null;joystick.x=joystick.y=0;stick.style.transform='translate(0,0)'}}joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
$('fireBtn').addEventListener('pointerdown',e=>{fireHeld=true;$('fireBtn').setPointerCapture(e.pointerId);if(fireCooldown<=0)shoot()});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('fireBtn').addEventListener(ev,()=>fireHeld=false));$('reload').onclick=reload;

const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')fireHeld=true;if(e.key.toLowerCase()==='r')reload()});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.key===' ')fireHeld=false});setInterval(()=>{if(!playing)return;joystick.x=(keys.d?1:0)-(keys.a?1:0);joystick.y=(keys.s?1:0)-(keys.w?1:0);let l=Math.hypot(joystick.x,joystick.y);if(l>1){joystick.x/=l;joystick.y/=l}},30);
$('menuCoins').textContent=save.coins;$('bestWave').textContent=save.bestWave;draw();
